# =============================================================================
# Jo Fashion Hair - Configuração base (produção-safe)
# Segredos SEMPRE por variável de ambiente, nunca no repositório.
# =============================================================================
spring:
  application:
    name: jo-fashion-hair-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jofashion}
    username: ${DB_USER:jofashion}
    # sem valor padrão: em produção a API não sobe sem DB_PASSWORD (o perfil dev define um)
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é dono do Flyway; o Hibernate só valida
    properties:
      hibernate:
        jdbc.time_zone: UTC       # persiste tudo em UTC (TIMESTAMPTZ)

  flyway:
    enabled: true
    locations: classpath:db/migration

  # SMTP para enviar e-mails (Hostinger: smtp.hostinger.com, porta 465, SSL)
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Atrás do Nginx: usa o IP real da cliente (X-Forwarded-For), confiando só em proxies locais
  forward-headers-strategy: native
  # Erros nunca mostram detalhes internos do código
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never

app:
  timezone: America/Sao_Paulo
  # Endereço público do site (usado no link da política de privacidade no WhatsApp)
  site-url: ${SITE_URL:http://localhost:5173}
  # Modo demonstração (desligado; o perfil "demo" liga)
  demo:
    habilitado: false
    chave-mestra: ${DEMO_CHAVE_MESTRA:}
    max-sessoes: ${DEMO_MAX_VISITANTES:25}
    horas-sessao: ${DEMO_HORAS:3}
  # Primeiro acesso do DONO: usado só para criar a conta na primeira vez que a API sobe.
  # Depois disso, a senha é trocada pelo próprio painel (código por e-mail).
  # ADMIN_FORCAR_SENHA=true redefine a senha do dono para ADMIN_PASSWORD (emergência).
  admin:
    email: ${ADMIN_EMAIL:}
    nome: ${ADMIN_NOME:Dono do salão}
    senha: ${ADMIN_PASSWORD:}
    forcar-senha: ${ADMIN_FORCAR_SENHA:false}
  # Cookie do dispositivo confirmado: só por HTTPS em produção
  seguranca:
    cookie-seguro: ${COOKIE_SEGURO:true}
    dias-dispositivo-confiavel: 90
  # E-mails do sistema (códigos de verificação e convites)
  email:
    enviar: ${EMAIL_ENVIAR:true}
    remetente: ${MAIL_FROM:${MAIL_USERNAME:}}
  # Integração WhatsApp (Evolution API v2)
  whatsapp:
    base-url: ${EVOLUTION_BASE_URL:http://localhost:8081}
    api-key: ${EVOLUTION_API_KEY:troque-me}
    instance: ${EVOLUTION_INSTANCE:jofashion}
    # segredo que vai na URL do webhook: /api/webhooks/whatsapp/{segredo}
    webhook-secret: ${WEBHOOK_SECRET:troque-me}
    enviar-mensagens: ${WHATSAPP_ENVIAR:true}
    expiracao-conversa-horas: 3
    pausa-atendimento-humano-horas: 12
  # Imagens enviadas pelo painel (logo, fotos do salão e da equipe).
  # Em produção, aponte para uma pasta que NÃO é apagada a cada deploy.
  uploads:
    diretorio: ${UPLOADS_DIR:./uploads}
  # Sinal por Pix. Com o Mercado Pago configurado, a confirmação é automática;
  # sem ele, usa a chave Pix cadastrada no painel e a equipe confirma o recebimento.
  pagamentos:
    mercadopago-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    mercadopago-webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    mercadopago-email-pagador: ${MERCADOPAGO_EMAIL_PAGADOR:}
  # Lembretes automáticos por WhatsApp (pedem confirmação: 1 - Confirmar / 2 - Cancelar)
  lembretes:
    habilitado: ${LEMBRETES_HABILITADO:true}
    primeiro-horas: 24
    segundo-horas: 2
    minimo-minutos-antes: 15
    # não manda mensagem de madrugada
    silencio-inicio: "21:00"
    silencio-fim: "07:30"
  agenda:
    # Granularidade dos horários sugeridos como alternativa
    slot-minutos: 15
    # Antecedência mínima para agendar (evita marcar "para daqui a 5 minutos")
    antecedencia-minima-minutos: 60
  cors:
    # origens do front-end (separe várias por vírgula na variável de ambiente)
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:jofashion_dev}
  flyway:
    # no perfil dev carrega também o seed de exemplo
    locations: classpath:db/migration,classpath:db/seed
    # o seed (V1000+) roda antes das migrations novas num banco já existente:
    # permite aplicar V2, V3, V4... depois dele
    out-of-order: true
app:
  admin:
    # acesso padrão SÓ para desenvolvimento local
    email: ${ADMIN_EMAIL:admin@jofashionhair.local}
    senha: ${ADMIN_PASSWORD:admin12345}
  email:
    # em dev os e-mails (com os códigos) só aparecem no log da API
    enviar: ${EMAIL_ENVIAR:false}
  seguranca:
    # localhost não tem HTTPS
    cookie-seguro: ${COOKIE_SEGURO:false}
  whatsapp:
    # em dev o robô só escreve as respostas no log (use o simulador do /admin)
    enviar-mensagens: ${WHATSAPP_ENVIAR:false}
logging:
  level:
    org.hibernate.SQL: debug

---
# =============================================================================
# Perfil "demo": versão pública para testar no Render
# Cada visitante ganha uma cópia própria dos dados (schema demo_N) e entra no
# painel sem senha. O dono edita os dados originais com ?mestre=CHAVE + login.
# =============================================================================
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 6
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    out-of-order: true
  web:
    resources:
      static-locations: file:/app/static/,classpath:/static/
app:
  site-url: ${SITE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  demo:
    habilitado: true
  admin:
    email: ${ADMIN_EMAIL:dono@demo.myhair}
  email:
    enviar: false
  whatsapp:
    enviar-mensagens: false
  lembretes:
    habilitado: false
  seguranca:
    cookie-seguro: ${COOKIE_SEGURO:true}
  cors:
    allowed-origins: ${RENDER_EXTERNAL_URL:http://localhost:8080}
